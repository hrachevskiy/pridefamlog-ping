name: keepalive

# Render Free усыпляет сервис, если на него 15 минут никто не ходит. Спящий воркер
# не опрашивает Telegram, и /info висел бы до пробуждения, поэтому раз в 5 минут
# просто трогаем health-адрес.

on:
  schedule:
    # смещение на 4-ю минуту: GitHub перерегистрирует расписание только когда сама
    # строка cron меняется, а не когда рядом просто правится комментарий
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: touch the worker
        run: |
          # -f: запуск зелёный только если воркер ответил 2xx. Ошибка соединения или
          # 5xx красит прогон — по нему и видно, что будильник сломался.
          curl -sf -m 30 -o /dev/null -w "http %{http_code} за %{time_total}s\n" \
            https://pridefamlog-worker.onrender.com/
